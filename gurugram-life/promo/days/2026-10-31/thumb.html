<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&display=swap"><style>*{margin:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;font-family:"Baloo 2",sans-serif;background:#120c08}
.bg{position:absolute;inset:0;background:url(bg.jpg) center/cover;filter:saturate(1.3) contrast(1.1)}
.s{-webkit-text-stroke:16px #120c08;paint-order:stroke fill;text-shadow:0 10px 0 #120c08}
.top{position:absolute;left:40px;right:40px;top:150px;text-align:center}
.pov{display:inline-block;background:#fff;color:#111;font:800 72px/1.1 "Baloo 2";padding:14px 34px 4px;border-radius:24px;transform:rotate(-2deg)}

.big span{color:#fff;font-size:118px}
.tag{position:absolute;left:50%;bottom:190px;transform:translateX(-50%) rotate(2deg);background:#4a148c;color:#fff;font:800 64px "Baloo 2";padding:10px 36px 0;border-radius:20px;border:6px solid #120c08;white-space:nowrap}
</style></head><body><div class="bg"></div><div class="top"><div class="pov">POV: Halloween in<br>Gurugram 🎃</div></div><div class="big s">EMI DUE<br><span>TOMORROW 😱</span></div><div class="tag">THE FINAL BOSS</div></body></html>
