<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1b1f2a">
<meta name="description" content="Gurugram Life – a lightweight browser life-sim set in Gurugram, Haryana.">
<title>Gurugram Life</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff8a3d'/%3E%3Cpath d='M14 48V26l10-6v28M28 48V14l12 6v28M44 48V30l8 4v14' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Sign in -->
<section id="screen-login" class="screen active">
  <div class="card login-card">
    <div class="logo">Gurugram <span>Life</span></div>
    <p class="tag">Millennium City, one chai at a time.</p>
    <label>Username<input id="login-name" maxlength="16" autocomplete="username" placeholder="e.g. rahul_ggn"></label>
    <label>PIN <small>(optional, 4 digits, stays on this device)</small><input id="login-pin" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" placeholder="••••"></label>
    <div id="login-err" class="err"></div>
    <button id="btn-login" class="btn primary">Sign in / Create account</button>
    <button id="btn-guest" class="btn ghost">Play as guest (one tap)</button>
    <div id="profile-list"></div>
    <p class="fine">Progress is saved in this browser. All businesses and brands in the game are fictional.</p>
  </div>
</section>

<!-- Character creator -->
<section id="screen-create" class="screen">
  <div class="card create-card">
    <h2>Create your character</h2>
    <div class="create-grid">
      <div class="preview-wrap"><canvas id="preview" width="200" height="240"></canvas></div>
      <div class="create-opts">
        <label>Name<input id="cc-name" maxlength="16"></label>
        <div class="opt"><span>Skin</span><div id="cc-skin" class="swatches"></div></div>
        <div class="opt"><span>Hair</span><div id="cc-hair" class="swatches"></div></div>
        <div class="opt"><span>Hairstyle</span><div id="cc-style" class="chips"></div></div>
        <div class="opt"><span>Shirt</span><div id="cc-shirt" class="swatches"></div></div>
        <div class="opt"><span>Pants</span><div id="cc-pants" class="swatches"></div></div>
      </div>
    </div>
    <h3>Your backstory</h3>
    <div id="cc-bg" class="bg-list"></div>
    <button id="btn-start" class="btn primary">Move to Gurugram →</button>
  </div>
</section>

<!-- Game -->
<section id="screen-game" class="screen">
  <canvas id="game"></canvas>
  <canvas id="game3d" class="hidden"></canvas>
  <div id="hud">
    <div class="hud-top">
      <div class="pill" id="hud-time"></div>
      <div class="pill" id="hud-weather"></div>
      <div class="pill lvl" id="hud-lvl"></div>
      <div class="pill money" id="hud-money"></div>
    </div>
    <div class="bars">
      <div class="bar"><i>❤️</i><b><s id="bar-health"></s></b></div>
      <div class="bar"><i>🍛</i><b><s id="bar-hunger"></s></b></div>
      <div class="bar"><i>⚡</i><b><s id="bar-energy"></s></b></div>
      <div class="bar"><i>💬</i><b><s id="bar-social"></s></b></div>
    </div>
    <div class="pill loc" id="hud-loc"></div>
    <div class="pill task" id="hud-task"></div>
  </div>
  <div id="prompt"></div>
  <canvas id="minimap" width="192" height="144"></canvas>
  <div id="hud-buttons">
    <button id="btn-phone" title="Phone (P)">📱</button>
    <button id="btn-map" title="Map (M)">🗺️</button>
    <button id="btn-veh" title="Ride your vehicle (F)">🛵</button>
    <button id="btn-gift" title="Rewards (G)">🎁</button>
    <button id="btn-help" title="Help guide (H)">❓</button>
  </div>
  <div id="touch">
    <div id="stick"><div id="knob"></div></div>
    <button id="btn-act">E</button>
  </div>
  <div id="keylegend" class="hidden"></div>
  <div id="toasts"></div>
</section>

<!-- Overlays -->
<div id="phone" class="hidden">
  <div class="phone-frame">
    <div class="phone-status"><span id="ph-time"></span><span>5G ▮▮▮ 🔋</span></div>
    <div id="phone-body"></div>
    <button class="phone-home" id="phone-home" aria-label="Home"></button>
  </div>
</div>
<div id="modal" class="hidden"><div class="modal-box"><button class="x" id="modal-x">✕</button><div id="modal-body"></div></div></div>
<div id="mapview" class="hidden">
  <div class="map-box">
    <div class="map-head"><b id="map-title">Gurugram</b><span id="map-hint">Tap anywhere to set a waypoint</span><button class="x" id="map-x">✕</button></div>
    <canvas id="bigmap"></canvas>
    <div class="map-actions" id="map-actions"></div>
  </div>
</div>
<div id="celebrate" class="hidden"></div>
<canvas id="confetti" class="hidden"></canvas>
<div id="activity" class="hidden"><div class="act-box"><div id="act-text"></div><div class="act-bar"><s id="act-fill"></s></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/data.js"></script>
<script src="js/render3d.js"></script>
<script src="js/game.js"></script>
</body>
</html>
